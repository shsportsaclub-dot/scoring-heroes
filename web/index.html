<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoring Heroes | Match Centre</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f3f7ff;background:#081526}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #f5c95c;outline-offset:3px}
header{background:linear-gradient(115deg,#081526,#123b6b 70%,#7b233a);padding:16px max(16px,calc((100vw - 1160px)/2));border-bottom:1px solid #4e6686}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.1em;color:#f8d778}.search{flex:1;min-width:160px;background:#102b4b;border:1px solid #456084;border-radius:9px;color:white;padding:10px}.register{background:#e9bd58;color:#101827;border:0;border-radius:8px;padding:10px 14px;font-weight:800}.shell{max-width:1160px;margin:auto;padding:16px}.eyebrow{font-size:12px;color:#b7c9e1;text-transform:uppercase;letter-spacing:.1em}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center}.status{font-size:12px;color:#ffe3a2;border:1px solid #977b45;border-radius:40px;padding:5px 10px}.score{background:linear-gradient(120deg,#102d4c,#14243c);border:1px solid #304d6b;border-radius:16px;padding:20px;margin-top:14px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.team:last-child{text-align:right}.team strong{font-size:clamp(22px,4vw,38px)}.vs{color:#9caec5}.summary{color:#d8e4f5;font-size:14px;margin-top:16px}.tabs{display:flex;overflow-x:auto;gap:4px;border-bottom:1px solid #30445e;margin-top:20px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;border:0;background:transparent;color:#b7c8de;padding:13px 11px;font-size:12px;font-weight:700}.tabs button[aria-selected=true]{color:white;border-bottom:3px solid #ef5563}.panel{min-height:200px;padding:20px 4px}.tile{border:1px solid #314965;background:#10243d;border-radius:12px;padding:16px;margin:10px 0}.muted{color:#a7b9d1}.notice{background:#332d1e;color:#ffe5a6;border-radius:9px;padding:10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{background:#1b395b;color:#fff;border:1px solid #4d6682;padding:9px;border-radius:8px}a{color:#f5d078}@media(max-width:600px){.teams{grid-template-columns:1fr 32px 1fr}.shell{padding:12px}.score{padding:15px}}
</style></head><body>
<header><div class="top"><div class="brand">SCORING HEROES</div><input class="search" id="search" aria-label="Search sports and matches" placeholder="Search matches, teams, players"><button class="register" id="register">Register now</button></div></header>
<main class="shell"><div class="hero"><div><div class="eyebrow">Cricket / Match Centre</div><h1>Match Intelligence</h1></div><span class="status" id="feed-status">DEMO DATA</span></div>
<div class="notice" id="notice">Sample match for interface testing. This is not a live score. Configure a licensed data endpoint to display real matches.</div>
<section class="score" aria-label="Match score"><div class="eyebrow" id="match-title">Sample T20 Match</div><div class="teams"><div class="team"><div id="team-a">Team A</div><strong id="score-a">145/3</strong></div><div class="vs">VS</div><div class="team"><div id="team-b">Team B</div><strong id="score-b">142/8</strong></div></div><div class="summary" id="match-summary">Sample result — Team A won by 3 runs</div></section>
<nav class="tabs" role="tablist" aria-label="Match sections" id="tabs"></nav><section id="panel" class="panel" role="tabpanel" aria-live="polite"></section>
</main>
<script>
"use strict";
const names=["MATCH REVIEW","LIVE","SCORECARD","COMMENTARY","PLAYING XI","SQUADS","OVERS","GRAPHS","H2H","TEAM STRENGTH","MATCH INSIGHTS","VENUE","HIGHLIGHTS","NEWS"];
const sample={id:"demo-001",title:"Sample T20 Match",teams:[{name:"Team A",score:"145/3"},{name:"Team B",score:"142/8"}],summary:"Sample result — Team A won by 3 runs",status:"demo",events:[{id:"demo-e1",text:"19.6 — Sample innings complete"},{id:"demo-e2",text:"19.5 — 1 run (sample event)"}],scorecard:[{name:"Team A",runs:145,wickets:3},{name:"Team B",runs:142,wickets:8}]};
let match=sample,active="LIVE",controller=null;
const el=id=>document.getElementById(id);
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderMatch(){el("match-title").textContent=match.title||"Match";el("team-a").textContent=match.teams?.[0]?.name||"Team A";el("team-b").textContent=match.teams?.[1]?.name||"Team B";el("score-a").textContent=match.teams?.[0]?.score||"—";el("score-b").textContent=match.teams?.[1]?.score||"—";el("match-summary").textContent=match.summary||"Match details pending";el("feed-status").textContent=match.status==="demo"?"DEMO DATA":(match.status||"UNKNOWN").toUpperCase();}
function panelContent(){if(active==="LIVE")return '<div class="grid"><div class="tile"><h3>Live match status</h3><p>'+escapeHTML(match.summary||"Pending")+'</p></div><div class="tile"><h3>Recent events</h3>'+(match.events||[]).slice(0,8).map(e=>'<p>'+escapeHTML(e.text)+'</p>').join("")+'</div></div>';if(active==="SCORECARD")return '<div class="grid">'+(match.scorecard||[]).map(t=>'<div class="tile"><h3>'+escapeHTML(t.name)+'</h3><p>'+escapeHTML(t.runs)+' / '+escapeHTML(t.wickets)+'</p></div>').join("")+'</div>';if(active==="COMMENTARY")return '<div class="tile">'+(match.events||[]).map(e=>'<p>'+escapeHTML(e.text)+'</p>').join("")+'</div>';return '<div class="tile"><h3>'+escapeHTML(active)+'</h3><p class="muted">This section requires a verified '+escapeHTML(active.toLowerCase())+' data source. No fabricated statistics are shown.</p></div>';}
function renderTabs(){el("tabs").innerHTML=names.map(n=>'<button type="button" role="tab" aria-selected="'+(n===active)+'" data-tab="'+n+'">'+n+'</button>').join("");el("panel").innerHTML=panelContent();}
el("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){active=b.dataset.tab;renderTabs();}});
el("register").addEventListener("click",()=>{el("notice").textContent="Registration service is not connected in this preview. No account has been created.";});
el("search").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();el("notice").textContent=q?"Search preview: "+(match.teams||[]).filter(t=>t.name.toLowerCase().includes(q)).map(t=>t.name).join(", ")+" — full search backend pending.":"Sample match for interface testing. This is not a live score.";});
async function loadFeed(){const url=new URLSearchParams(location.search).get("feed");if(!url)return; if(!url.startsWith("/")||url.startsWith("//")){el("notice").textContent="Only same-origin feed paths are allowed.";return;}try{controller?.abort();controller=new AbortController();const r=await fetch(url,{signal:controller.signal,cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();if(!data||!Array.isArray(data.teams)||data.teams.length<2||!data.id)throw Error("Invalid match response");match=data;renderMatch();renderTabs();el("notice").textContent="Connected to same-origin feed. Verify provider licensing, event freshness and server timestamps before marking LIVE.";}catch(err){el("notice").textContent="Feed unavailable: "+err.message+". Showing sample data.";}}
renderMatch();renderTabs();loadFeed();
</script></body></html>
