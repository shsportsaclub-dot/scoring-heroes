function live(){const c=match.currentOver||{},b=match.bowler,balls=c.balls||[],last=balls.length?balls[balls.length-1]:"—",target=match.target===null||match.target===undefined?null:Number(match.target),runs=Number(String(match.teams?.[0]?.score||"").split(/[/-]/)[0]),legal=Number(match.legalBalls??(String(match.overs||"0.0").split(".").reduce((a,v,i)=>i===0?Number(v)*6:Number(a)+Number(v),0))),total=match.totalOvers===null||match.totalOvers===undefined?null:Number(match.totalOvers),remaining=Number.isFinite(total)&&total>0?Math.max(0,total*6-legal):null,needed=Number.isFinite(target)&&target>0&&Number.isFinite(runs)?Math.max(0,target-runs):null,rrr=needed!==null&&remaining>0&&needed>0?(needed*6/remaining).toFixed(2):null,summary=needed!==null&&remaining!==null?(needed>0?esc(match.teams?.[0]?.name)+" need "+needed+" runs in "+remaining+" balls":"Target reached"):esc(match.summary),filled=balls.map(x=>'<span class="ball '+ballClass(x)+'">'+esc(x)+'</span>').join(""),empty=Array.from({length:Math.max(0,6-balls.filter(x=>!/(wd|nb)/i.test(String(x))).length)},()=>'<span class="ball placeholder">·</span>').join("");return '<section class="score live-scoreboard" aria-label="Live match score"><div class="scoreboard-team"><span class="batting-label">BATTING</span>'+teamBadge(match.teams?.[0])+'</div><div class="scoreboard-center"><div class="scoreline">'+esc(match.teams?.[0]?.score)+'</div><div class="overs">'+esc(match.overs)+' overs</div><div class="scoreboard-last">Last ball: '+esc(last)+'</div></div><div class="scoreboard-team scoreboard-opponent"><span class="bowling-label">BOWLING</span>'+teamBadge(match.teams?.[1])+'</div></section>'+drsStrip()+'<div class="target-strip"><span>CRR: '+esc(match.crr)+'</span><span>RRR: '+(rrr??'—')+'</span><span>Target: '+(Number.isFinite(target)&&target>0?target:'—')+'</span></div>'+ballEffect()+'<div class="result">'+summary+'</div>'+livePlayerSummary()+'<div class="over"><strong>Over '+esc(c.number)+'</strong>'+filled+empty+'<strong> function pitchPanel(){const p=match.pitchAnalysis;if(!p||typeof p!=="object")return '<section class="info-section"><h3>Format-specific Pitch Prediction</h3><p>Waiting for venue records and verified pitch observations.</p></section>';const format=String(p.format||"Unknown"),n=Number(p.sampleSize),avg=Number(p.firstInningsAverage),valid=Number.isInteger(n)&&n>0&&Number.isFinite(avg)&&avg>=0;const value=key=>{const raw=p.suitability?.[key];const x=raw===null||raw===undefined?NaN:Number(raw);return Number.isFinite(x)&&x>=0&&x<=100?x:null;};const metric=(label,key)=>{const x=value(key);if(x===null)return '<div class="pitch-metric"><span>'+esc(label)+': Not available</span></div>';return '<div class="pitch-metric"><div>'+esc(label)+' <strong>'+x.toFixed(0)+'%</strong></div><div class="pitch-gradient"><span style="left:'+x+'%"></span></div></div>';};return '<section class="info-section pitch-analysis"><h3>Format-specific Pitch Prediction</h3><p>Format: '+esc(format)+' · Venue sample: '+(valid?n+' matches':'Insufficient data')+'</p><p>Average 1st innings: '+(valid?avg.toFixed(1):'Not available')+'</p><div class="pitch-records"><h4>VENUE MATCH RESULTS · '+esc(format)+'</h4><div class="pitch-record-grid">'+[["Total Matches","totalMatches"],["Batting First Wins","batFirstWins"],["Chasing Wins","chasingWins"],["Tied / No Result","otherResults"]].map(([label,key])=>{const raw=p.venueResults?.[key];const num=raw===null||raw===undefined?NaN:Number(raw);return '<div class="pitch-record"><span>'+label+'</span><strong>'+(Number.isInteger(num)&&num>=0?num:"—")+'</strong></div>';}).join("")+'</div></div><div class="pitch-records"><h4>GROUND TOP RECORDS · MATCH LINKS</h4>'+((Array.isArray(p.topRecords)&&p.topRecords.length)?p.topRecords.map(rec=>{const name=String(rec?.title||rec?.type||"Record");const teams=Array.isArray(rec?.teams)?rec.teams.map(String).join(" vs "):String(rec?.teams||"Teams unavailable");const score=rec?.score===undefined?"":String(rec.score);const id=String(rec?.matchId||"");const link=id&&/^[A-Za-z0-9_-]{1,80}$/.test(id)?'<a class="record-match-link" href="/match/'+encodeURIComponent(id)+'">View match →</a>':"";return '<div class="record-match"><div><strong>'+esc(name)+'</strong><p>'+esc(teams)+(score?" · "+esc(score):"")+'</p></div>'+link+'</div>';}).join(""):'<p>Historical record matches are not available yet.</p>')+'</div><div class="pitch-records"><h4>VENUE FORMAT RECORDS</h4><div class="pitch-record-grid">'+[["Highest Score","highestScore"],["Lowest Score","lowestScore"],["Average Score","averageScore"],["Highest Successful Chase","highestSuccessfulChase"],["Lowest Defended Total","lowestDefendedTotal"]].map(([label,key])=>'<div class="pitch-record"><span>'+label+'</span><strong>'+((p.records&&p.records[key]!==null&&p.records[key]!==undefined&&Number.isFinite(Number(p.records[key]))&&Number(p.records[key])>=0)?esc(p.records[key]):"—")+'</strong></div>').join("")+'</div><div class="info-provenance">Records must match this venue and match format; successful chase and defended totals are historical results, not guarantees.</div></div><div class="pitch-two-lines"><div class="pitch-line"><h4>BATTERS</h4>'+metric("Batting Friendly","batters")+'</div><div class="pitch-line"><h4>BOWLERS</h4><div class="pitch-bowlers">'+metric("Medium / Fast Pace","pacers")+metric("Spin","spinners")+'</div></div></div><p>'+esc(typeof p.insight==="string"?p.insight:"Pitch suitability is not confirmed.")+'</p><div class="info-provenance">'+esc(p.verified===true?"Verified observations":"Estimate / unverified")+'</div></section>';}
function info(){const fields=[["Squads","squads"],["Weather","weather"],["Toss","toss"],["Pitch Report","pitchReport"],["Team Head-to-Head","headToHead"],["Prediction","prediction"]];const safeValue=value=>{if(typeof value==="string"&&value.trim())return value;if(typeof value==="number"&&Number.isFinite(value))return String(value);if(Array.isArray(value))return value.length?value.map(x=>typeof x==="string"?x:(x&&typeof x==="object"?(x.name||x.player_name||"Unknown player"):"Unknown player")).join(", "):null;if(value&&typeof value==="object"){if(value.available===false)return null;return Object.entries(value).filter(([k,v])=>k!=="available"&&v!==null&&v!==undefined&&typeof v!=="object").map(([k,v])=>k.replace(/_/g," ")+": "+String(v)).join(" · ")||null;}return null;};return '<div class="info-grid">'+fields.map(([label,key])=>{const value=safeValue(match[key]);const source=match.infoSources?.[key];const verified=source?.verified===true;const date=source?.updatedAt;return '<section class="info-section"><h3>'+esc(label)+'</h3><p>'+esc(value||"Not available yet")+'</p><div class="info-provenance">'+(value?(verified?"Verified source":"Unverified / source not confirmed"):"Awaiting data")+(date?" · Updated "+esc(date):"")+'</div></section>';}).join("")+pitchPanel()+'</div>';}
function playingXI(){const sides=match.playingXI;if(!sides)return '<div class="empty">Playing XI is not announced or verified yet.</div>';return '<div class="info-grid">'+Object.entries(sides).map(([team,players])=>'<section class="info-section"><h3>'+esc(team)+'</h3><p>'+esc(Array.isArray(players)?players.join(" · "):"Not available")+'</p></section>').join("")+'</div>';}
function other(){if(selected==="OVERS"){const overs=Array.isArray(match.overTimeline)?match.overTimeline:[];return overs.length?'<div class="over-history">'+overs.map(o=>'<section class="info-section"><h3>Over '+esc(o.number)+' · '+esc(o.runs)+' runs</h3><div class="over">'+(Array.isArray(o.balls)?o.balls:[]).map(ball=>'<span class="ball '+ballClass(ball)+'">'+esc(ball)+'</span>').join('')+'</div></section>').join('')+'</div>':'<div class="empty">Over history not available.</div>';}if(selected==="INFO")return info();if(selected==="PLAYING XI")return playingXI();if(selected==="DREAM11")return '<div class="empty"><h3>Dream11 / Fantasy</h3>Fantasy suggestions will appear only when verified squads, roles and player data are available. No fabricated fantasy picks.</div>';if(selected==="COMMENTARY")return '<div class="empty">'+((match.events||[]).length?(match.events||[]).map(e=>'<p>'+esc(e.text)+'</p>').join(''):'No verified commentary events available.')+'</div>';if(selected==="SCORECARD")return '<div class="empty">'+((match.scorecard||[]).length?(match.scorecard||[]).map(s=>'<p>'+esc(s.name)+': '+esc(s.runs)+'/'+esc(s.wickets)+'</p>').join(''):'Full innings scorecard is not available from this feed.')+'</div>';return '<div class="empty"><h3>'+esc(selected)+'</h3>Verified data or a connected service is required for this section. No fabricated statistics will be displayed.</div>';}
function render(){const tabs=$("tabs");tabs.innerHTML=sections.map(n=>'<button role="tab" aria-selected="'+(selected===n)+'" data-tab="'+esc(n)+'">'+esc(n)+'</button>').join('');$("panel").innerHTML=selected==="LIVE"?live():other();$("title").textContent=match.title||"Match Centre";}
$("tabs").addEventListener("click",e=>{const t=e.target.closest("[data-tab]");if(t){selected=t.dataset.tab;render();}});
$("panel").addEventListener("click",e=>{if(e.target.id==="share"){const msg=(match.title||"Match")+" | "+(match.teams||[]).map(t=>t.name+" "+t.score).join(" vs ")+" | "+(match.summary||"");if(navigator.share){navigator.share({title:match.title,text:msg,url:location.href}).catch(()=>{});}else if(navigator.clipboard){navigator.clipboard.writeText(msg+" "+location.href).then(()=>$("notice").textContent="Score copied for sharing").catch(()=>$("notice").textContent="Sharing unavailable");}return;}if(e.target.id==="quiz")$("notice").textContent="Quiz is not yet connected; no answers are collected.";});

for(const id of ["pin","bell"])$(id).addEventListener("click",()=>{$(id).setAttribute("aria-pressed",$(id).getAttribute("aria-pressed")==="true"?"false":"true");$("notice").textContent="Preview preference only; account sync and notifications are not yet enabled.";});
const feedPath=new URLSearchParams(location.search).get("feed");let feedPending=false;let lastUpdated=null;
async function connect(){if(!feedPath)return;if(!feedPath.startsWith("/")||feedPath.startsWith("//")){$("notice").textContent="Only same-origin feed URLs are supported.";return;}if(feedPending||document.hidden)return;feedPending=true;try{const r=await fetch(feedPath,{cache:"no-store",headers:{"Accept":"application/json"}});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();if(!data?.id||!Array.isArray(data.teams)||data.teams.length<2)throw Error("Invalid feed schema");if(data.updated_at&&lastUpdated&&Date.parse(data.updated_at)<Date.parse(lastUpdated))throw Error("Older snapshot received");lastUpdated=data.updated_at||lastUpdated;match=data;render();const age=data.updated_at?Date.now()-Date.parse(data.updated_at):NaN;const stale=!Number.isFinite(age)||age>180000||age< -60000;$("notice").textContent=(stale?"STALE / timestamp unavailable · ":"Updated · ")+(data.status==="verified"?"Verified feed":"Unverified feed")+" · "+(data.updated_at||"No timestamp");}catch(e){$("notice").textContent="Feed unavailable: "+e.message+(lastUpdated?". Last received score retained.":". Reference demo only; not live.");}finally{feedPending=false;}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)connect();});
if(feedPath)setInterval(()=>{if(!document.hidden)connect();},5000);
render();connect();
