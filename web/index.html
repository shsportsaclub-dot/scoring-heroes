<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scoring Heroes — Live Match</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#09131e;color:#edf5ff}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #e7c36e;outline-offset:2px}header{background:linear-gradient(115deg,#101c2b,#173b65 75%,#65293e);padding:13px 15px;border-bottom:1px solid #35506b}.brand{font-size:12px;letter-spacing:.13em;color:#e9ca80;font-weight:900}.bar{display:flex;align-items:center;gap:10px;margin-top:10px}.back{border:0;background:transparent;color:#fff;font-size:22px}.title{flex:1;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.iconbtn{background:none;border:0;color:#d6e3f1;font-size:20px}.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #293849;background:#101b27}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;border:0;border-bottom:3px solid transparent;padding:15px 12px;color:#b5c4d5;background:none;font-weight:600;white-space:nowrap;font-size:13px}.tabs button[aria-selected=true]{color:white;border-color:#f35a70}.wrap{max-width:900px;margin:auto}.score{padding:22px 17px 18px;background:linear-gradient(125deg,#112a44,#101c2c);display:grid;grid-template-columns:1fr auto;gap:12px}.small{color:#aab9cc;font-size:12px}.scoreline{font-size:36px;font-weight:850;color:#6ce4d9;letter-spacing:-.04em}.overs{font-size:17px;color:#acbbcd;font-weight:400}.teamline{display:flex;align-items:center;gap:12px}.emblem{font-size:31px}.break{font-size:20px;font-weight:800;color:#f3d982;align-self:center;text-align:right}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 18px;background:#172532;color:#c3cedd;font-size:13px}.result{background:#101513;text-align:center;padding:11px;color:#eac277;font-weight:750}.over{display:flex;align-items:center;gap:8px;padding:14px 10px;overflow-x:auto;background:#0b1622;white-space:nowrap;font-size:12px}.ball{border:1px solid #304258;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex-shrink:0;font-weight:750}.tablehead,.player{display:grid;grid-template-columns:minmax(125px,1fr) 66px 42px 42px 54px;gap:5px;align-items:center;padding:13px 14px}.tablehead{color:#9eafc2;font-size:12px;background:#14202c}.player{border-bottom:1px solid #233141;font-size:14px;min-height:61px}.player strong{font-weight:650}.number{text-align:right}.foot{display:flex;justify-content:space-between;gap:10px;padding:14px;font-size:12px;color:#a9bfd9}.bowlerhead,.bowler{grid-template-columns:minmax(120px,1fr) 75px 65px 60px}.quiz{margin:18px 14px;padding:20px;border-radius:18px;background:linear-gradient(135deg,#1d3555,#292a48);text-align:center}.quiz h3{margin:0 0 16px}.quiz button{background:#385578;border:0;border-radius:10px;padding:11px 18px;color:white}.note{padding:10px 14px;color:#e7ce97;background:#3b2c1c;font-size:12px}.empty{padding:22px 14px;color:#b6c5d5}.sr{position:absolute;left:-9999px}@media(min-width:700px){.scoreline{font-size:44px}.score{border-radius:14px 14px 0 0;margin-top:14px}.wrap{padding:0 10px}}
</style></head><body><header><div class="wrap"><div class="brand">SCORING HEROES</div><div class="bar"><button class="back" id="back" aria-label="Back">‹</button><div class="title" id="title">IND-A vs NZ-A · First Class · Demo</div><button class="iconbtn" id="pin" aria-label="Pin match" aria-pressed="false">♧</button><button class="iconbtn" id="bell" aria-label="Notifications" aria-pressed="false">♢</button></div></div></header><main class="wrap"><nav class="tabs" id="tabs" role="tablist" aria-label="Match sections"></nav><div class="note" id="notice">REFERENCE DEMO — values below are sample data, not a current live score.</div><section id="panel" role="tabpanel" aria-live="polite"></section></main><script>
"use strict";
const sections=["MATCH REVIEW","LIVE","SCORECARD","COMMENTARY","PLAYING XI","SQUADS","OVERS","GRAPHS","H2H","TEAM STRENGTH","MATCH INSIGHTS","VENUE","HIGHLIGHTS","NEWS","HISTORY","DISCUSSIONS"];
const demo={id:"demo-firstclass",title:"IND-A vs NZ-A · First Class",status:"demo",teams:[{name:"IND-A",score:"377/5"},{name:"NZ-A",score:"—"}],inningsLabel:"2nd Inn",overs:"90.0",breakLabel:"Tea Break",crr:"4.19",session:"Day 3 · S2",oversLeftToday:"36.0",summary:"IND-A lead by 173 runs",currentOver:{number:"90",balls:["1","1","1","2","0","2"],runs:7},batters:[{name:"Washington Sundar",striker:true,runs:2,balls:3,fours:0,sixes:0,sr:"66.7"},{name:"Yash Rathod",runs:66,balls:70,fours:8,sixes:0,sr:"94.3"}],partnership:"8 (7)",lastWicket:"D Padikkal 199 (248)",bowler:{name:"Jayden Lennox",wickets:0,runs:88,overs:"13.0",economy:"6.77"},events:[],scorecard:[]};
let match=demo,selected="LIVE";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function row(b){return '<div class="player"><strong>'+esc(b.name)+(b.striker?' <span style="color:#f0c56b">◆</span>':'')+'</strong><span class="number">'+esc(b.runs)+' ('+esc(b.balls)+')</span><span class="number">'+esc(b.fours)+'</span><span class="number">'+esc(b.sixes)+'</span><span class="number">'+esc(b.sr)+'</span></div>';}
function live(){const c=match.currentOver||{},b=match.bowler;return '<section class="score"><div><div class="teamline"><span class="emblem" aria-hidden="true">🏏</span><div><div>'+esc(match.teams?.[0]?.name)+' <span class="small">'+esc(match.inningsLabel)+'</span></div><div class="scoreline">'+esc(match.teams?.[0]?.score)+' <span class="overs">'+esc(match.overs)+'</span></div></div></div></div><div class="break">'+esc(match.breakLabel||match.status)+'</div></section><div class="meta"><span>CRR: '+esc(match.crr)+'</span><span>'+esc(match.session)+'</span><span>Overs left: '+esc(match.oversLeftToday)+'</span></div><div class="result">'+esc(match.summary)+'</div><div class="over"><strong>Over '+esc(c.number)+'</strong>'+(c.balls||[]).map(x=>'<span class="ball">'+esc(x)+'</span>').join('')+'<strong>= '+esc(c.runs)+'</strong></div><div class="tablehead"><span>Batter</span><span class="number">R (B)</span><span class="number">4s</span><span class="number">6s</span><span class="number">SR</span></div>'+(match.batters||[]).map(row).join('')+'<div class="foot"><span>P’ship: '+esc(match.partnership)+'</span><span>Last wkt: '+esc(match.lastWicket)+'</span></div><div class="tablehead bowlerhead"><span>Bowler</span><span class="number">W-R</span><span class="number">Overs</span><span class="number">Econ</span></div>'+(b?'<div class="player bowler"><strong>'+esc(b.name)+'</strong><span class="number">'+esc(b.wickets)+'-'+esc(b.runs)+'</span><span class="number">'+esc(b.overs)+'</span><span class="number">'+esc(b.economy)+'</span></div>':'<div class="empty">Bowler data unavailable</div>')+'<div class="quiz"><h3>Match Quiz & Fan Engagement</h3><p class="small">Quiz service will be enabled when verified player data is available.</p><button id="quiz" type="button">Quiz coming soon</button></div>';}
function other(){if(selected==="COMMENTARY")return '<div class="empty">'+((match.events||[]).length?(match.events||[]).map(e=>'<p>'+esc(e.text)+'</p>').join(''):'No verified commentary events available.')+'</div>';if(selected==="SCORECARD")return '<div class="empty">'+((match.scorecard||[]).length?(match.scorecard||[]).map(s=>'<p>'+esc(s.name)+': '+esc(s.runs)+'/'+esc(s.wickets)+'</p>').join(''):'Full innings scorecard is not available from this feed.')+'</div>';return '<div class="empty"><h3>'+esc(selected)+'</h3>Verified data or a connected service is required for this section. No fabricated statistics will be displayed.</div>';}
function render(){const tabs=$("tabs");tabs.innerHTML=sections.map(n=>'<button role="tab" aria-selected="'+(selected===n)+'" data-tab="'+esc(n)+'">'+esc(n)+'</button>').join('');$("panel").innerHTML=selected==="LIVE"?live():other();$("title").textContent=match.title||"Match Centre";}
$("tabs").addEventListener("click",e=>{const t=e.target.closest("[data-tab]");if(t){selected=t.dataset.tab;render();}});
$("panel").addEventListener("click",e=>{if(e.target.id==="quiz")$("notice").textContent="Quiz is not yet connected; no answers are collected.";});
$("back").addEventListener("click",()=>{if(history.length>1)history.back();else $("notice").textContent="No previous page in this preview.";});
for(const id of ["pin","bell"])$(id).addEventListener("click",()=>{$(id).setAttribute("aria-pressed",$(id).getAttribute("aria-pressed")==="true"?"false":"true");$("notice").textContent="Preview preference only; account sync and notifications are not yet enabled.";});
async function connect(){const url=new URLSearchParams(location.search).get("feed");if(!url)return;if(!url.startsWith("/")||url.startsWith("//")){$("notice").textContent="Only same-origin feed URLs are supported.";return;}try{const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();if(!data?.id||!Array.isArray(data.teams)||data.teams.length<2)throw Error("Invalid feed schema");match=data;render();$("notice").textContent="Provider feed connected. Detailed LIVE fields appear only when provided by the backend; timestamps and rights must be verified.";}catch(e){$("notice").textContent="Feed error: "+e.message+". Showing reference demo.";}}
render();connect();
</script><script src="scorer-preview.js" defer></script></body></html>
