<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scoring Heroes | Viewer Polling Demo</title><style>body{margin:0;background:#081624;color:#edf6ff;font-family:system-ui;padding:18px;max-width:680px}input,button{padding:10px;border-radius:8px;font:inherit}input{background:#1a324c;color:white;border:1px solid #55708c;width:min(100%,430px)}button{background:#254a70;color:white;border:1px solid #55708c;margin:8px 5px 8px 0}#score{font-size:38px;color:#6be1d6;font-weight:900}.warning{color:#f0c778}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#13283c;padding:12px}small{color:#a8bed3}</style></head><body><h1>SCORING HEROES · Viewer</h1><p class="warning">Polling prototype. It does not bypass authenticated APIs and never sends a scoring token.</p><label for="path">Same-origin public read-only JSON URL</label><p><input id="path" value="/api/v1/public-local-view"></p><button id="start">Start 5-second polling</button><button id="stop">Stop</button><p id="status" role="status">Not connected</p><h2 id="score">—</h2><small id="info">Awaiting verified endpoint</small><h3>Recent Commentary</h3><pre id="events">No events</pre><script>
"use strict";let timer=null,inFlight=false;const $=id=>document.getElementById(id);
async function refresh(){if(inFlight)return;const path=$("path").value.trim();if(!path.startsWith("/")||path.startsWith("//")||path.includes("..")){$("status").textContent="Only safe same-origin paths allowed";stop();return;}inFlight=true;try{const r=await fetch(path,{cache:"no-store",credentials:"same-origin"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();if(!d||!Array.isArray(d.teams)||!d.id)throw Error("Invalid payload");$("score").textContent=d.teams[0]?.score??"—";$("info").textContent=(d.title||"Match")+" · "+(d.overs||"—")+" overs · status: "+(d.status||"unknown");$("events").textContent=(d.events||[]).slice(0,8).map(e=>e.text).join("\n")||"No commentary";$("status").textContent="Updated "+new Date().toLocaleTimeString()+" (not proof of live provenance)";}catch(e){$("status").textContent="Feed unavailable: "+e.message;}finally{inFlight=false;}}
function stop(){if(timer!==null)clearInterval(timer);timer=null;}
$("start").onclick=()=>{stop();refresh();timer=setInterval(refresh,5000);};$("stop").onclick=()=>{stop();$("status").textContent="Polling stopped";};document.addEventListener("visibilitychange",()=>{if(document.hidden)stop();});
</script></body></html>
