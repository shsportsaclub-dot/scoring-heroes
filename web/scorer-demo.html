<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scoring Heroes | Scorer Practice</title><style>:root{font-family:system-ui;background:#091625;color:#f3f7ff}*{box-sizing:border-box}body{margin:0 auto;max-width:640px;padding:20px}h1{font-size:24px}small,p{color:#b9c9db}.warning{background:#3c2e1d;color:#f8d28b;padding:12px;border-radius:10px}.score{font-size:38px;font-weight:900;color:#7ce8e0;margin:18px 0}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.controls button,.actions button{background:#203e60;color:#fff;border:1px solid #4e6b8b;border-radius:10px;padding:17px 8px;font-size:17px;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.actions button{font-size:13px;padding:11px}pre{overflow:auto;background:#132a42;padding:14px;border-radius:10px;font-size:12px}button:focus-visible{outline:3px solid #f4cf75}label{display:block;margin:10px 0}input{background:#132a42;border:1px solid #4e6b8b;color:white;padding:8px;border-radius:8px;width:100%}</style></head><body><h1>SCORING HEROES · Practice Scorer</h1><div class="warning">LOCAL PRACTICE ONLY. No live match is changed. No token or server connection is used.</div><label>Batter ID <input id="batter" value="batter-1" maxlength="60"></label><label>Bowler ID <input id="bowler" value="bowler-1" maxlength="60"></label><div class="score" id="score">0/0 (0.0)</div><div class="controls" id="controls"></div><div class="actions"><button id="undo">Undo last ball</button><button id="reset">Reset practice</button><button id="copy">Copy events JSON</button></div><h2>Event Journal Preview</h2><pre id="journal">[]</pre><script>
"use strict";let events=[],next=1;
const $=id=>document.getElementById(id);
const choices=[["0",0,0,"none",true],["1",1,0,"none",true],["2",2,0,"none",true],["3",3,0,"none",true],["4",4,0,"none",true],["6",6,0,"none",true],["Wide +1",0,1,"wide",false],["No-ball +1",0,1,"no_ball",false],["Bye +1",0,1,"bye",true],["Leg-bye +1",0,1,"leg_bye",true],["Wicket",0,0,"none",true,"bowled"]];
function draw(){let runs=0,w=0,balls=0;for(const e of events){runs+=e.bat_runs+e.extra_runs;balls+=Number(e.legal_delivery);if(e.wicket)w++;}$("score").textContent=runs+"/"+w+" ("+Math.floor(balls/6)+"."+(balls%6)+")";$("journal").textContent=JSON.stringify(events,null,2);}
function add(c){const batter=$("batter").value.trim(),bowler=$("bowler").value.trim();if(!batter||!bowler){alert("Enter batter and bowler IDs");return;}const e={type:"delivery",event_id:"practice-"+next,revision:1,sequence:next++,innings:1,batter_id:batter,bowler_id:bowler,bat_runs:c[1],extra_runs:c[2],extra_type:c[3],legal_delivery:c[4]};if(c[5])e.wicket={kind:c[5]};events.push(e);draw();}
for(const c of choices){const b=document.createElement("button");b.textContent=c[0];b.onclick=()=>add(c);$("controls").append(b);}
$("undo").onclick=()=>{events.pop();draw();};$("reset").onclick=()=>{if(confirm("Clear all practice events?")){events=[];next=1;draw();}};$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(events,null,2));$("copy").textContent="Copied";}catch{alert("Clipboard unavailable; select JSON below.");}};draw();
</script></body></html>
