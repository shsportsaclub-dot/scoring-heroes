name: PHP scorer foundation checks
on:
  push:
    branches: [main, feature/ecosystem-foundation-20261026]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax validation
        run: |
          find api -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run scorer foundation regression tests
        run: |
          set -e
          for test in api/tests/*.php; do
            echo "Running $test"
            php "$test"
          done
