name: Cricket Catalogue Auto Sync
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cricket-catalogue-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync approved JSON feeds
        env:
          ALLOWED_FEED_HOSTS: ${{ vars.CRICKET_FEED_HOSTS }}
        run: python cricket-auto-sync/sync.py
      - name: Commit updated catalogue
        run: |
          git config user.name "scoring-heroes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cricket-auto-sync/catalogue.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync cricket competition catalogue"
            git push
          fi
