name: Build Scoring Heroes APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/ecosystem-foundation-20261026" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCORING-HEROES-13.0.2-LIVE-SPORTS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  emulator-evidence:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APK from build job
        uses: actions/download-artifact@v4
        with:
          name: SCORING-HEROES-13.0.2-LIVE-SPORTS-APK
          path: app/build/outputs/apk/debug/

      - name: Initialize runtime evidence folder
        run: mkdir -p runtime-evidence

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and capture registration runtime evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -cores 2 -memory 2048 -feature -Vulkan
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.scoringheroes.app
            adb shell monkey -p com.scoringheroes.app -c android.intent.category.LAUNCHER 1
            sleep 3
            mkdir -p runtime-evidence
            adb devices -l | tee runtime-evidence/adb-devices.txt
            timeout 8s adb shell getprop sys.boot_completed > runtime-evidence/boot-status.txt 2>&1 || true
            for attempt in 1 2 3; do if timeout 20s adb exec-out screencap -p > runtime-evidence/welcome.png && test -s runtime-evidence/welcome.png; then echo "Screenshot captured on attempt $attempt"; break; else echo "Screenshot attempt $attempt failed" >> runtime-evidence/screenshot-errors.log; rm -f runtime-evidence/welcome.png; adb reconnect || true; sleep 3; fi; done
            test -s runtime-evidence/welcome.png
            timeout 40s adb shell uiautomator dump /sdcard/welcome.xml
            timeout 20s adb pull /sdcard/welcome.xml runtime-evidence/welcome.xml
            python3 -c 'import xml.etree.ElementTree as E; r=E.parse("runtime-evidence/welcome.xml"); assert list(r.iter("node")), "Empty UI hierarchy"'
            python3 scripts/check-email-entry.py > runtime-evidence/ui-test.log 2>&1 || { cat runtime-evidence/ui-test.log; exit 1; }
            cat runtime-evidence/ui-test.log

      - name: Capture diagnostics after emulator failure
        if: failure()
        run: |
          mkdir -p runtime-evidence
          adb devices -l > runtime-evidence/failure-adb-devices.txt 2>&1 || true
          timeout 15s adb logcat -d -t 300 > runtime-evidence/failure-logcat.txt 2>&1 || true
          df -h > runtime-evidence/runner-disk.txt || true
          free -m > runtime-evidence/runner-memory.txt || true
          ps aux | grep -E "emulator|qemu|adb" > runtime-evidence/emulator-processes.txt || true

      - name: Upload Welcome runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welcome-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn

