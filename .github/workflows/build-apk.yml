name: Build Scoring Heroes APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/ecosystem-foundation-20261026" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCORING-HEROES-13.0.2-LIVE-SPORTS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  emulator-evidence:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APK from build job
        uses: actions/download-artifact@v4
        with:
          name: SCORING-HEROES-13.0.2-LIVE-SPORTS-APK
          path: app/build/outputs/apk/debug/

      - name: Initialize runtime evidence folder
        run: mkdir -p runtime-evidence

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and capture registration runtime evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -cores 2 -memory 2048
          script: bash scripts/emulator-evidence.sh
      - name: Capture diagnostics after emulator failure
        if: failure()
        run: |
          mkdir -p runtime-evidence
          adb devices -l > runtime-evidence/failure-adb-devices.txt 2>&1 || true
          timeout 15s adb logcat -d -t 300 > runtime-evidence/failure-logcat.txt 2>&1 || true
          df -h > runtime-evidence/runner-disk.txt || true
          free -m > runtime-evidence/runner-memory.txt || true
          ps aux | grep -E "emulator|qemu|adb" > runtime-evidence/emulator-processes.txt || true

      - name: Upload Welcome runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welcome-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn

