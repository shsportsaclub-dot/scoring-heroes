<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SH SCR-001 — Schedule</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:white;font-family:Arial,sans-serif;overflow:hidden}.stage{position:absolute;width:86%;left:7%;top:16%;padding:28px;border-radius:24px;background:linear-gradient(140deg,rgba(6,19,42,.96),rgba(8,26,57,.94));border:1px solid #3a94c3;box-shadow:inset 0 0 25px #147fb32a;animation:enter .8s cubic-bezier(.16,1,.3,1) both}.head{background:#102c50;border-radius:13px;padding:17px 25px;display:flex;justify-content:space-between;align-items:center;color:#78dcff;font-weight:bold}.head span{color:#f9c66b}.label{font-size:34px;margin:25px 8px}.fixture{display:grid;grid-template-columns:2fr 2fr 55px 2fr 1fr;align-items:center;gap:20px;padding:22px;margin:14px 0;background:#142644;border:1px solid #2a557f;border-left:6px solid #efba64;border-radius:16px;animation:card .7s both}.fixture:nth-of-type(3){animation-delay:.15s}.fixture:nth-of-type(4){animation-delay:.3s}.date{font-size:14px;color:#85d7f3}.team{font-weight:800;font-size:23px}.vs{color:#ffcb73;font-size:20px;font-weight:800}.status{background:#23566a;border-radius:15px;padding:12px;text-align:center;font-size:13px}.foot{font-size:14px;color:#99b9d4;margin:20px 8px 0}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes enter{from{opacity:0;transform:perspective(900px) rotateX(12deg) translateY(110px) scale(.95)}to{opacity:1;transform:none}}@keyframes card{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}@keyframes pulse{50%{box-shadow:0 0 23px #48e6ff88}}@media(max-width:850px){.stage{width:94%;left:3%;top:10%;padding:14px}.fixture{gap:8px;padding:12px}.team{font-size:13px}.label{font-size:22px}.date{font-size:10px}.status{font-size:9px;padding:7px}}
</style></head><body><section class="stage"><header class="head"><div>SCORING HEROES <small> / MATCH CENTRE</small></div><span>SEASON 2026</span></header><h1 class="label">NEXT MATCHES</h1><div id="fixtures"></div><div class="foot">SH SPORTS MINI STADIUM • ORIGINAL GRAPHICS PROTOTYPE • SCR-001</div></section><script>
const initial=[{date:'TODAY • 07:30 PM',home:'HAPUR HAWKS',away:'CITY TITANS',status:'LIVE SOON'},{date:'TOMORROW • 06:00 PM',home:'NORTH WARRIORS',away:'ROYAL STRIKERS',status:'UPCOMING'},{date:'FRI • 04:00 PM',home:'SH SPORTS XI',away:'VALLEY KINGS',status:'UPCOMING'}];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(fixtures){document.getElementById('fixtures').innerHTML=fixtures.map(f=>`<div class="fixture"><div class="date">${esc(f.date)}</div><div class="team">${esc(f.home)}</div><div class="vs">VS</div><div class="team">${esc(f.away)}</div><div class="status pulse">${esc(f.status)}</div></div>`).join('')};render(initial);window.ScoringHeroes={updateFixtures:render};window.addEventListener('message',e=>{if(e.data?.type==='SH_FIXTURES_UPDATE'&&Array.isArray(e.data.fixtures))render(e.data.fixtures)});
</script></body></html>
